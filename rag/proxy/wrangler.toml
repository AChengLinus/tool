name = "tool-rag-proxy"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# 当前使用七牛云推理（qnaigc）。换别家时改这两行即可。
LLM_BASE_URL = "https://api.qnaigc.com/v1"
LLM_MODEL = "qiniu/conatus-free"
# 允许调用代理的站点，逗号分隔；不要写 *
# 证书签发前站点走 http，签发后走 https，两个都保留最稳。
ALLOWED_ORIGINS = "https://tool.acheng9616.com,http://tool.acheng9616.com,http://127.0.0.1:8000,http://localhost:8000,http://127.0.0.1:8019"
MAX_TOKENS = "700"
DAILY_LIMIT = "30"

# 可选：绑定一个 KV 命名空间后，Worker 会按 IP 做每日限额（防止公开接口被刷）
# [[kv_namespaces]]
# binding = "RAG_LIMIT"
# id = "REPLACE_WITH_YOUR_KV_ID"

# API Key 不要写在这里，用命令写入 Secret：
#   wrangler secret put LLM_API_KEY
